<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code in Black - Image Generation & Inpainting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #canvasContainer {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    #baseCanvas, #maskCanvas {
      border-radius: 0.5rem;
      max-width: 100%;
      height: auto;
      display: block;
    }
    #maskCanvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      opacity: 0.6; 
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">

    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">
        Inpainting & Image Editor
      </h1>
      <p class="text-slate-400 text-sm">
        Fast, canvas-optimized edits with mask drawing.
      </p>
    </header>

    <!-- Configuration Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg space-y-4">
      <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">1. Settings</h2>
      <div class="space-y-1">
        <label for="modelSelect" class="block text-xs font-medium text-slate-300">Target Model</label>
        <input type="text" id="modelSelect" value="gemini-3.1-flash-image" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition" />
      </div>
    </div>

    <!-- Input Form Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg space-y-4">
      <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">2. Image & Masking</h2>

      <div class="space-y-2">
        <label class="block text-xs font-medium text-slate-300">Upload Image (Automatically scaled to 512px for high-speed processing)</label>
        <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 transition cursor-pointer bg-slate-900 border border-slate-700 rounded-lg" />
        
        <div id="workspace" class="hidden flex flex-col items-center space-y-4 pt-4 border-t border-slate-700 mt-4">
          <div class="w-full flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700">
            <div class="flex items-center space-x-3">
              <label for="brushSize" class="text-xs text-slate-300">Brush Size:</label>
              <input type="range" id="brushSize" min="5" max="50" value="20" class="w-24 accent-indigo-500" />
            </div>
            <button id="clearMaskBtn" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded transition">
              Clear Mask
            </button>
          </div>

          <p class="text-xs text-indigo-300 w-full text-center">Draw over the area you want to fix.</p>

          <div id="canvasContainer">
            <canvas id="baseCanvas"></canvas>
            <canvas id="maskCanvas"></canvas>
          </div>
        </div>
      </div>

      <div class="space-y-1">
        <label for="promptInput" class="block text-xs font-medium text-slate-300">Repair Instructions</label>
        <textarea 
          id="promptInput" 
          rows="3" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition resize-y"
        >Repair the masked teeth to look like healthy, real working teeth. Fix rotten or broken areas and root canals naturally. Strictly maintain realistic enamel textures, slight natural imperfections, and original tooth anatomy. Do not make them look like perfect plastic.</textarea>
      </div>

      <button id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg shadow-md transition duration-150 flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <span id="btnText">Execute Inpainting</span>
        <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </div>

    <!-- Output Response Card -->
    <div id="outputCard" class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg space-y-3 hidden">
      <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Restoration Result</h2>
      <div id="errorMessage" class="bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg text-sm hidden"></div>
      <div id="responseContainer" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const workspace = document.getElementById('workspace');
    const baseCanvas = document.getElementById('baseCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const brushSizeInput = document.getElementById('brushSize');
    const clearMaskBtn = document.getElementById('clearMaskBtn');
    
    const baseCtx = baseCanvas.getContext('2d');
    const maskCtx = maskCanvas.getContext('2d');

    let isDrawing = false;
    let hasImage = false;

    // --- Image Loading & 512px Downscaling ---
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // Strictly force 512px downscale for extreme speed
          const MAX_SIZE = 512;
          let width = img.width;
          let height = img.height;

          if (width > MAX_SIZE || height > MAX_SIZE) {
            if (width > height) {
              height = Math.round((height * MAX_SIZE) / width);
              width = MAX_SIZE;
            } else {
              width = Math.round((width * MAX_SIZE) / height);
              height = MAX_SIZE;
            }
          }

          baseCanvas.width = width;
          baseCanvas.height = height;
          maskCanvas.width = width;
          maskCanvas.height = height;

          baseCtx.drawImage(img, 0, 0, width, height);
          clearMask();
          
          workspace.classList.remove('hidden');
          hasImage = true;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // --- Mask Drawing Logic ---
    function clearMask() {
      maskCtx.fillStyle = 'black'; 
      maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
    }

    clearMaskBtn.addEventListener('click', clearMask);

    function getMousePos(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      draw(e);
    }

    function stopDrawing() {
      isDrawing = false;
      maskCtx.beginPath();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault(); 
      const pos = getMousePos(maskCanvas, e.touches ? e.touches[0] : e);
      maskCtx.lineWidth = brushSizeInput.value;
      maskCtx.lineCap = 'round';
      maskCtx.strokeStyle = 'white'; 
      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);
    }

    maskCanvas.addEventListener('mousedown', startDrawing);
    maskCanvas.addEventListener('mousemove', draw);
    maskCanvas.addEventListener('mouseup', stopDrawing);
    maskCanvas.addEventListener('mouseout', stopDrawing);
    maskCanvas.addEventListener('touchstart', startDrawing, {passive: false});
    maskCanvas.addEventListener('touchmove', draw, {passive: false});
    maskCanvas.addEventListener('touchend', stopDrawing);

    // --- Secure API Submission to Netlify ---
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('promptInput').value.trim();
      const selectedModel = document.getElementById('modelSelect').value.trim();

      if (!hasImage) { alert('Please upload an image and draw a mask.'); return; }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      const outputCard = document.getElementById('outputCard');
      const responseContainer = document.getElementById('responseContainer');
      const errorMessage = document.getElementById('errorMessage');

      submitBtn.disabled = true;
      spinner.classList.remove('hidden');
      outputCard.classList.remove('hidden');
      errorMessage.classList.add('hidden');
      responseContainer.innerHTML = '';

      // Live Timer
      let seconds = 0;
      btnText.textContent = `Generating... (${seconds}s)`;
      const timerInterval = setInterval(() => {
        seconds++;
        btnText.textContent = `Generating... (${seconds}s)`;
      }, 1000);

      // 2.5 min Timeout Controller
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 150000); 

      // Calls your own server instead of Google directly
      const endpoint = `/.netlify/functions/inpaint`;

      try {
        // Compress heavily to keep the payload lightweight for the serverless function
        const base64Image = baseCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        const base64Mask = maskCanvas.toDataURL('image/jpeg', 1.0).split(',')[1];

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            image: base64Image,
            mask: base64Mask,
            model: selectedModel
          }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Server responded with an error.");

        const candidateParts = data.candidates?.[0]?.content?.parts || [];
        let hasContent = false;

        // Loop through the parts. Look ONLY for the image.
        candidateParts.forEach((part) => {
          const inlineImg = part.inlineData || part.inline_data;
          
          if (inlineImg && inlineImg.data) {
            hasContent = true;
            const imgSrc = `data:${inlineImg.mimeType || 'image/jpeg'};base64,${inlineImg.data}`;

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'flex flex-col items-center space-y-3 bg-slate-900 border border-slate-700 p-4 rounded-xl mt-4';
            imgWrapper.innerHTML = `
              <img src="${imgSrc}" class="rounded-lg max-h-[500px] w-auto border border-slate-700 object-contain shadow-lg" />
              <a href="${imgSrc}" download="restored-image.jpg" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow">
                Download Result
              </a>
            `;
            responseContainer.innerHTML = ''; 
            responseContainer.appendChild(imgWrapper);
          }
        });

        if (!hasContent) {
          throw new Error("The API responded successfully, but no image data was found in the payload.");
        }

      } catch (err) {
        if (err.name === 'AbortError') {
          errorMessage.textContent = 'Error: The request timed out after 2.5 minutes. The Google API is likely congested.';
        } else {
          errorMessage.textContent = `Error: ${err.message}`;
        }
        errorMessage.classList.remove('hidden');
      } finally {
        clearInterval(timerInterval); 
        submitBtn.disabled = false;
        btnText.textContent = 'Execute Inpainting';
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera - Braces Filter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Camera Viewfinder */
        .camera-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        canvas {
            display: none;
        }

        /* UI Overlays */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            pointer-events: none;
        }

        /* Top Controls */
        .top-controls {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px 20px;
            height: 120px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
            pointer-events: auto;
        }

        .dynamic-island {
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            margin-top: 5px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 15px;
        }

        .camera-dot {
            width: 5px;
            height: 5px;
            background-color: #34C759;
            border-radius: 50%;
        }

        /* Bottom Controls */
        .bottom-controls {
            padding-bottom: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }

        /* Mode Selector */
        .mode-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            margin-top: 30px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .mode-btn {
            color: rgba(255,255,255,0.7);
            cursor: pointer;
        }

        .mode-btn.active {
            color: #FFD60A;
        }

        /* Shutter Area */
        .shutter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 40px;
        }

        .gallery-preview {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background-color: #333;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
        }

        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .shutter-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 0 0 0 4px #fff;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .shutter-btn:active {
            transform: scale(0.95);
        }

        .flip-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5); /* Darker backdrop to match your screenshot */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .flip-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        /* Loading / Result Screens */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .overlay-screen img.result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 50px;
            left: 20px;
            color: #fff;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 101;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #FFD60A;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

<div class="camera-container">
    <!-- Camera Feed -->
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="photo-canvas"></canvas>

    <!-- Top UI Layer -->
    <div class="ui-layer top-controls">
        <div class="dynamic-island">
            <div class="camera-dot"></div>
        </div>
    </div>

    <!-- Bottom UI Layer -->
    <div class="ui-layer bottom-controls">
        <div class="mode-selector">
            <div class="mode-btn">VIDEO</div>
            <div class="mode-btn active">PHOTO</div>
        </div>

        <div class="shutter-row">
            <div class="gallery-preview" id="gallery-preview">
                <!-- Most recent photo goes here -->
            </div>
            
            <div class="shutter-btn" id="shutter-btn"></div>
            
            <div class="flip-btn" id="flip-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C21.54 14.82 22 13.47 22 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
            </div>
        </div>
    </div>
</div>

<!-- Loading Screen -->
<div class="overlay-screen" id="loading-screen">
    <div class="spinner"></div>
    <div class="status-text">Applying structural modifications...<br>(Generating braces)</div>
</div>

<!-- Result Screen -->
<div class="overlay-screen" id="result-screen">
    <div class="close-btn" id="close-result">Cancel</div>
    <img class="result-image" id="result-image" src="" alt="Edited selfie">
</div>

<script>
    // Configuration
    // IN PRODUCTION/NETLIFY: This string will be replaced by your build script, 
    // OR you can dynamically load it if you inject it into window.env
    const GEMINI_API_KEY = '%%YOUR_GEMINI_API_KEY%%'; 
    const MODEL_NAME = 'gemini-3.1-flash-lite-image';

    // The precise prompt requested by the user
    const EDITING_PROMPT = `In the provided selfie/portrait, perform a precise dental modification: add modern metallic orthodontic braces directly onto the existing visible teeth.
Anatomical & Biological Constraints:
Preserve original identity: Do NOT alter the facial bone structure, jawline, chin, cheekbones, lips, or mouth shape in any way.
Preserve dental layout: Keep the exact original tooth count, spacing, size, alignment, and position. Do not add, remove, reshape, or shift any teeth.
Anatomically correct braces: Render realistic silver stainless-steel brackets positioned centered on the front surface of each visible tooth (incisors, canines, premolars). Connect them with a thin, natural metallic archwire following the natural arch of the smile, secured with small elastic ligatures.
Visual Quality:
Match the exact lighting, subsurface scattering, depth of field, resolution, and skin/tooth textures of the original photo.
Ensure realistic light reflections on the metal brackets and enamel without synthetic blurring or face warping.`;

    // DOM Elements
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('photo-canvas');
    const shutterBtn = document.getElementById('shutter-btn');
    const flipBtn = document.getElementById('flip-btn');
    const loadingScreen = document.getElementById('loading-screen');
    const resultScreen = document.getElementById('result-screen');
    const resultImage = document.getElementById('result-image');
    const closeResultBtn = document.getElementById('close-result');
    const galleryPreview = document.getElementById('gallery-preview');

    let currentFacingMode = 'user'; // Default to selfie for portraits
    let currentStream = null;

    // Initialize Camera
    async function initCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: {
                facingMode: currentFacingMode,
                width: { ideal: 1080 },
                height: { ideal: 1920 }
            },
            audio: false
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            
            // Adjust video transform for selfie mode (mirroring)
            if (currentFacingMode === 'user') {
                video.style.transform = 'scaleX(-1)';
            } else {
                video.style.transform = 'scaleX(1)';
            }
        } catch (err) {
            console.error("Error accessing camera: ", err);
            alert("Unable to access camera. Please ensure permissions are granted.");
        }
    }

    // Flip Camera
    flipBtn.addEventListener('click', () => {
        currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
        initCamera();
    });

    // Capture Photo and trigger API
    shutterBtn.addEventListener('click', () => {
        // Prepare canvas to match video dimensions
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const ctx = canvas.getContext('2d');
        
        // Handle mirroring if selfie cam is active
        if (currentFacingMode === 'user') {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }
        
        // Draw video frame to canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Get Base64 image
        const base64Image = canvas.toDataURL('image/jpeg', 0.9);
        
        // Set gallery preview thumbnail locally
        galleryPreview.innerHTML = `<img src="${base64Image}" />`;

        // Send to Gemini
        processImageWithGemini(base64Image);
    });

    // Close result screen
    closeResultBtn.addEventListener('click', () => {
        resultScreen.style.display = 'none';
        resultImage.src = '';
    });

    // Gemini API integration
    async function processImageWithGemini(base64DataUrl) {
        // Strip data:image/jpeg;base64, prefix for API
        const base64Data = base64DataUrl.split(',')[1];
        
        // Show loading state
        loadingScreen.style.display = 'flex';

        // Check for API key misconfiguration safely
        if (GEMINI_API_KEY.includes('YOUR_GEMINI_API_KEY')) {
            alert('Warning: Gemini API Key is missing. Please set the environment variable and build/replace it in the code.');
            loadingScreen.style.display = 'none';
            return;
        }

        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${GEMINI_API_KEY}`;
        
        // Payload based on standard Multimodal standard interactions 
        // with specific temperature constraints as requested (0.7).
        const payload = {
            contents: [
                {
                    role: "user",
                    parts: [
                        { text: EDITING_PROMPT },
                        {
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: base64Data
                            }
                        }
                    ]
                }
            ],
            generationConfig: {
                temperature: 0.7
            }
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || 'Failed to generate image');
            }

            // Extracting the returned image. 
            // In standard vision APIs, output text is in parts[0].text
            // In Gemini 3.1 Flash Lite Image (which returns interleaved text/image), 
            // we look for the inlineData object in the response parts.
            let editedImageBase64 = null;
            
            const parts = data.candidates?.[0]?.content?.parts || [];
            
            for (const part of parts) {
                if (part.inlineData && part.inlineData.data) {
                    editedImageBase64 = part.inlineData.data;
                    break;
                }
            }

            if (editedImageBase64) {
                resultImage.src = `data:image/jpeg;base64,${editedImageBase64}`;
                // Set the thumbnail to the edited photo
                galleryPreview.innerHTML = `<img src="data:image/jpeg;base64,${editedImageBase64}" />`;
            } else {
                // Fallback if the API returns text instead of an image link
                console.error("API did not return inlineData image. Raw response:", data);
                alert("API did not return an image. Ensure your API key has access to image generation features.");
            }
            
        } catch (error) {
            console.error("API Error:", error);
            alert(`Error processing image: ${error.message}`);
        } finally {
            loadingScreen.style.display = 'none';
            if(resultImage.src) {
                resultScreen.style.display = 'flex';
            }
        }
    }

    // Start on load
    window.addEventListener('load', initCamera);
</script>
</body>
</html>

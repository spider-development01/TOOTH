<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Smile Creo — Precision Dental Studio</title>
  
  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#0B5CFF',
              dark: '#0647C7',
              light: '#EEF4FF',
            },
            dark: {
              DEFAULT: '#0B1220',
              soft: '#111827',
              navy: '#0F172A'
            }
          },
          boxShadow: {
            'glass': '0 12px 32px 0 rgba(0, 0, 0, 0.3)',
            'glass-light': '0 8px 24px -4px rgba(15, 23, 42, 0.1)',
            'pill': '0 4px 16px rgba(11, 92, 255, 0.28)',
          }
        }
      }
    }
  </script>
  
  <!-- Supabase Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* Hardware Accelerated Viewports */
    .gpu-layer {
      transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
    }

    /* Custom Sleek Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(11, 92, 255, 0.8);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) rgba(15, 23, 42, 0.7);
    }

    .glass-dark {
      background: rgba(11, 18, 32, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    
    .glass-light {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .shutter-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 4px solid rgba(11, 18, 32, 0.85);
      outline: 3px solid #0B5CFF;
      transition: transform 0.1s ease;
    }
    .shutter-btn:active {
      transform: scale(0.9);
    }

    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #0B5CFF;
      cursor: pointer;
      margin-top: -5px;
      box-shadow: 0 2px 6px rgba(11, 92, 255, 0.4);
      border: 2px solid white;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #E2E8F0;
      border-radius: 9999px;
    }

    .fade-enter {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="h-screen h-[100dvh] w-screen overflow-hidden flex flex-col bg-slate-950 text-slate-900 antialiased select-none">

  <!-- COMPACT FLOATING HEADER -->
  <header class="absolute top-2.5 left-2.5 right-2.5 z-30 flex items-center justify-between pointer-events-none">
    <div class="glass-light pointer-events-auto w-8 h-8 rounded-full shadow-glass-light flex items-center justify-center">
      <div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-white text-[10px] font-bold shadow-sm">
        ✦
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center space-x-1.5 pointer-events-auto">
      <button id="navOpenGalleryBtn" class="glass-light px-3 py-1.5 rounded-full text-[11px] font-semibold text-slate-700 hover:text-dark shadow-glass-light transition active:scale-95 flex items-center space-x-1">
        <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span>Records</span>
      </button>

      <button id="navUploadBtn" class="bg-primary hover:bg-primary-dark text-white px-3 py-1.5 rounded-full text-[11px] font-semibold shadow-pill transition active:scale-95 flex items-center space-x-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        <span>Upload</span>
      </button>
      <input type="file" id="fileInput" class="hidden" accept="image/*" />
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="relative flex-1 w-full h-full overflow-hidden">

    <!-- VIEW 1: Camera & Capture Screen -->
    <div id="cameraView" class="absolute inset-0 flex flex-col justify-between z-10 bg-black">
      <div class="relative flex-1 w-full h-full flex items-center justify-center overflow-hidden">
        <video id="cameraFeed" class="absolute w-full h-full object-cover" autoplay playsinline></video>
        <canvas id="captureCanvas" class="hidden"></canvas>
      </div>

      <!-- Floating Bottom Action Bar -->
      <div class="absolute bottom-6 left-4 right-4 z-20 flex items-center justify-center pointer-events-none">
        <div class="glass-dark px-5 py-3 rounded-3xl shadow-glass flex items-center justify-around w-full max-w-xs pointer-events-auto">
          <!-- Library thumbnail -->
          <button id="openLibraryBtn" class="w-10 h-10 rounded-xl overflow-hidden bg-slate-800 border border-white/20 shadow-md active:scale-95 transition flex items-center justify-center">
            <div id="galleryThumbImg" class="w-full h-full bg-cover bg-center flex items-center justify-center text-white/70">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
          </button>

          <!-- Shutter Button -->
          <button id="captureBtn" class="shutter-btn shadow-2xl flex items-center justify-center"></button>

          <!-- Switch Camera -->
          <button id="switchCameraBtn" class="w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-xl text-white border border-white/20 active:scale-95 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- VIEW 2: Masking Editor Studio (Compact & High Real Estate) -->
    <div id="editorView" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-2xl z-20 flex flex-col items-center justify-between p-2 pt-14 pb-2.5 overflow-hidden">
      
      <!-- Top Action Bar -->
      <div class="glass-light px-3 py-1 rounded-full shadow-glass-light flex items-center space-x-2 shrink-0">
        <button id="cancelEditBtn" class="text-[11px] font-semibold text-slate-600 hover:text-dark flex items-center space-x-1 active:opacity-60">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          <span>Retake</span>
        </button>
        <span class="w-px h-3 bg-slate-300"></span>
        <span class="text-[11px] font-bold text-dark uppercase tracking-wider">Paint Tooth</span>
        <span class="w-px h-3 bg-slate-300"></span>
        <button id="clearMaskBtn" class="text-[11px] font-semibold text-primary hover:text-primary-dark active:opacity-60">
          Reset
        </button>
      </div>

      <!-- Mode & Zoom Bar -->
      <div class="w-full max-w-sm flex items-center justify-between px-1 my-1 shrink-0">
        <!-- Switcher: Move/Zoom vs Brush -->
        <div class="flex items-center p-0.5 bg-slate-900/90 rounded-xl border border-white/15 shadow-md space-x-0.5">
          <button id="editorToolPanBtn" type="button" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 bg-primary text-white shadow-pill">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
            <span>Move</span>
          </button>
          <button id="editorToolBrushBtn" type="button" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 text-slate-300 hover:text-white">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
            <span>Brush</span>
          </button>
        </div>

        <!-- Zoom Bar -->
        <div class="flex items-center p-0.5 bg-slate-900/90 rounded-xl border border-white/15 shadow-md space-x-0.5 text-white">
          <button id="editorZoomOutBtn" type="button" class="w-6 h-6 rounded-lg hover:bg-white/10 flex items-center justify-center font-bold text-xs transition active:scale-90 text-slate-300 hover:text-white">−</button>
          <button id="editorZoomResetBtn" type="button" class="px-1.5 h-6 rounded-lg hover:bg-white/10 flex items-center justify-center text-[10px] font-mono font-medium text-slate-300 hover:text-white" title="Reset">
            <span id="editorZoomLabel">100%</span>
          </button>
          <button id="editorZoomInBtn" type="button" class="w-6 h-6 rounded-lg hover:bg-white/10 flex items-center justify-center font-bold text-xs transition active:scale-90 text-slate-300 hover:text-white">+</button>
        </div>
      </div>

      <!-- Max-Sized Responsive Canvas Frame -->
      <div class="flex-1 w-full flex items-center justify-center p-0.5 overflow-hidden min-h-0">
        <div id="canvasContainer" class="relative rounded-2xl overflow-hidden bg-black flex items-center justify-center cursor-grab border border-white/20 shadow-glass" style="touch-action: none;">
          <div id="editorViewport" class="relative select-none gpu-layer" style="transform-origin: 0 0;">
            <canvas id="baseCanvas" class="block"></canvas>
            <canvas id="maskCanvas" class="absolute top-0 left-0 opacity-60"></canvas>
          </div>
        </div>
      </div>

      <!-- Compact Bottom Controls Card -->
      <div class="w-full max-w-sm glass-light rounded-2xl p-2 shadow-glass-light border border-white/80 space-y-1.5 shrink-0 mt-1">
        <!-- Brush Size Slider -->
        <div class="flex items-center space-x-2 bg-slate-100/90 px-2.5 py-1 rounded-xl border border-slate-200/70">
          <span class="text-[10px] font-semibold text-slate-600 shrink-0">Size</span>
          <input type="range" id="brushSize" min="4" max="60" value="16" class="flex-1" />
          <span id="brushSizeLabel" class="text-[10px] font-mono text-slate-600 font-medium shrink-0">16px</span>
        </div>

        <!-- Treatments In Compact Row -->
        <div class="grid grid-cols-4 gap-1">
          <button data-treatment="implants" class="treatment-pill flex items-center justify-center space-x-1 py-1 px-1 rounded-xl border border-primary bg-primary text-white transition active:scale-95 shadow-sm">
            <span class="text-xs">🦷</span>
            <span class="text-[10px] font-bold">Implant</span>
          </button>

          <button data-treatment="aligners" class="treatment-pill flex items-center justify-center space-x-1 py-1 px-1 rounded-xl border border-slate-200 bg-white/70 hover:bg-white text-slate-700 transition active:scale-95">
            <span class="text-xs">✨</span>
            <span class="text-[10px] font-bold">Align</span>
          </button>

          <button data-treatment="braces" class="treatment-pill flex items-center justify-center space-x-1 py-1 px-1 rounded-xl border border-slate-200 bg-white/70 hover:bg-white text-slate-700 transition active:scale-95">
            <span class="text-xs">🪥</span>
            <span class="text-[10px] font-bold">Brace</span>
          </button>

          <button data-treatment="whitening" class="treatment-pill flex items-center justify-center space-x-1 py-1 px-1 rounded-xl border border-slate-200 bg-white/70 hover:bg-white text-slate-700 transition active:scale-95">
            <span class="text-xs">💎</span>
            <span class="text-[10px] font-bold">White</span>
          </button>
        </div>

        <button id="submitBtn" class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-2 px-3 rounded-xl shadow-pill transition active:scale-[0.98] flex items-center justify-center space-x-1.5 text-xs">
          <span>Restore Tooth</span>
          <span class="text-[9px] bg-white/20 px-1.5 py-0.5 rounded-full">Precision Composite</span>
        </button>
      </div>

    </div>

    <!-- VIEW 3: Processing Overlay -->
    <div id="processingView" class="hidden absolute inset-0 bg-black/75 backdrop-blur-xl z-40 flex items-center justify-center p-4">
      <div class="glass-light rounded-3xl p-6 max-w-xs w-full shadow-glass text-center space-y-3.5 fade-enter">
        <div class="relative w-12 h-12 mx-auto flex items-center justify-center">
          <div class="absolute inset-0 rounded-full border-3 border-blue-100 border-t-primary animate-spin"></div>
          <span class="text-base">✨</span>
        </div>
        
        <div class="space-y-0.5">
          <h3 id="processingStepText" class="text-xs font-bold text-dark">Doing magic it is...</h3>
          <p class="text-[10px] text-slate-500">Doing magic it is...</p>
        </div>

        <div class="w-full bg-slate-200/80 h-1.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-primary h-full rounded-full transition-all duration-300 w-1/4"></div>
        </div>

        <span id="timerText" class="text-[10px] font-mono text-slate-400 block">Doing magic it is... 0s</span>
      </div>
    </div>

    <!-- VIEW 4: Comparison Slider (Refined & Maximized Viewport) -->
    <div id="comparisonView" class="hidden absolute inset-0 bg-black z-30 flex flex-col justify-between p-2 pt-14 pb-2">
      
      <!-- Top Navigation -->
      <div class="flex items-center justify-between w-full max-w-md mx-auto z-20 shrink-0 px-1">
        <button id="closeComparisonBtn" class="glass-dark px-3 py-1.5 rounded-full text-[11px] font-semibold text-white hover:text-slate-200 shadow-glass transition active:scale-95 flex items-center space-x-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          <span id="backBtnText">New Scan</span>
        </button>

        <div id="autoSaveBadge" class="glass-dark px-2.5 py-1 rounded-full text-[10px] font-medium text-white/90 shadow-glass flex items-center space-x-1.5">
          <span id="autoSaveIcon" class="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse"></span>
          <span id="autoSaveText">Auto-saving...</span>
        </div>

        <div class="flex items-center space-x-1">
          <button id="deleteBtn" class="hidden glass-dark p-1.5 text-rose-400 rounded-full hover:bg-rose-950/40 transition active:scale-95" title="Delete">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>

          <button id="downloadBtn" class="bg-primary hover:bg-primary-dark text-white px-3 py-1.5 rounded-full text-[11px] font-semibold shadow-pill transition active:scale-95 flex items-center space-x-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span>Export</span>
          </button>
        </div>
      </div>

      <!-- Mode & Zoom Bar -->
      <div class="flex items-center justify-between w-full max-w-md mx-auto px-1 my-1 z-20 shrink-0">
        <!-- Split vs Pan Toggle -->
        <div class="flex items-center p-0.5 bg-slate-900/90 rounded-xl border border-white/15 shadow-glass space-x-0.5">
          <button id="compModeSplitBtn" type="button" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 bg-primary text-white shadow-pill">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>
            <span>Slide</span>
          </button>
          <button id="compModePanBtn" type="button" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 text-slate-300 hover:text-white">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
            <span>Pan</span>
          </button>
        </div>

        <!-- Zoom In/Out/Reset -->
        <div class="flex items-center p-0.5 bg-slate-900/90 rounded-xl border border-white/15 shadow-glass space-x-0.5 text-white">
          <button id="compZoomOutBtn" type="button" class="w-6 h-6 rounded-lg hover:bg-white/10 flex items-center justify-center font-bold text-xs transition active:scale-90 text-slate-300 hover:text-white">−</button>
          <button id="compZoomResetBtn" type="button" class="px-1.5 h-6 rounded-lg hover:bg-white/10 flex items-center justify-center text-[10px] font-mono font-medium text-slate-300 hover:text-white">
            <span id="compZoomLabel">100%</span>
          </button>
          <button id="compZoomInBtn" type="button" class="w-6 h-6 rounded-lg hover:bg-white/10 flex items-center justify-center font-bold text-xs transition active:scale-90 text-slate-300 hover:text-white">+</button>
        </div>
      </div>

      <!-- High-Area Viewport (Zero Overflow) -->
      <div class="flex-1 w-full flex items-center justify-center p-0.5 overflow-hidden min-h-0 my-auto">
        <div id="compareContainer" class="relative rounded-2xl select-none bg-black overflow-hidden shadow-2xl border border-white/15" style="touch-action: none;">
          
          <div id="compareViewport" class="relative select-none gpu-layer" style="transform-origin: 0 0;">
            <!-- Original -->
            <img id="imgOriginal" class="block rounded-2xl pointer-events-none" draggable="false" alt="Original" />
            
            <div class="absolute top-2.5 right-2.5 z-10 px-2 py-0.5 bg-black/60 backdrop-blur-md rounded-full text-[9px] font-bold tracking-wider text-white border border-white/20 uppercase">
              Original
            </div>

            <!-- Inpainted Layer -->
            <div id="imgOverlayWrapper" class="absolute top-0 left-0 h-full overflow-hidden rounded-2xl z-10" style="width: 50%;">
              <img id="imgGenerated" class="block rounded-2xl pointer-events-none max-w-none" draggable="false" alt="Inpainted" />
              
              <div class="absolute top-2.5 left-2.5 z-10 px-2 py-0.5 bg-primary/85 backdrop-blur-md rounded-full text-[9px] font-bold tracking-wider text-white border border-blue-300/40 uppercase">
                Inpainted
              </div>
            </div>
          </div>

          <!-- Slider Split Handle (Strictly disabled during pan) -->
          <div id="sliderHandle" class="absolute top-0 bottom-0 flex flex-col items-center justify-center cursor-ew-resize z-20" style="left: 50%; transform: translateX(-50%); width: 38px;">
            <div class="absolute top-0 bottom-0 w-0.5 bg-white shadow-xl"></div>
            <div class="relative w-7 h-7 bg-white rounded-full shadow-2xl flex items-center justify-center border border-primary text-primary active:scale-90 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>
            </div>
          </div>

        </div>
      </div>

      <div class="text-center text-[10px] font-medium text-white/50 pb-0.5 shrink-0">
        Zoom & slide to inspect dental restoration
      </div>
    </div>

    <!-- VIEW 5: Records Gallery -->
    <div id="libraryView" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-2xl z-40 flex flex-col p-3 pt-14">
      <div class="flex items-center justify-between max-w-md mx-auto w-full mb-3 shrink-0">

    // --- EDITOR ZOOM & PAN ENGINE ---
    function clampEditorPan() {
      const contW = canvasContainer.clientWidth;
      const contH = canvasContainer.clientHeight;
      const contentW = contW * editorZoom;
      const contentH = contH * editorZoom;

      if (editorZoom <= 1) {
        editorPanX = 0;
        editorPanY = 0;
        return;
      }

      const minX = contW - contentW - 40;
      const maxX = 40;
      const minY = contH - contentH - 40;
      const maxY = 40;

      editorPanX = Math.min(Math.max(editorPanX, minX), maxX);
      editorPanY = Math.min(Math.max(editorPanY, minY), maxY);
    }

    function updateEditorTransform() {
      if (editorRafPending) return;
      editorRafPending = true;
      requestAnimationFrame(() => {
        clampEditorPan();
        editorViewport.style.transform = `translate3d(${editorPanX}px, ${editorPanY}px, 0) scale(${editorZoom})`;
        editorZoomLabel.textContent = `${Math.round(editorZoom * 100)}%`;
        editorRafPending = false;
      });
    }

    function zoomEditorAt(newZoom, centerX, centerY) {
      newZoom = Math.min(Math.max(newZoom, 1), 6);
      if (Math.abs(newZoom - editorZoom) < 0.001) return;
      
      const factor = newZoom / editorZoom;
      editorPanX = centerX - (centerX - editorPanX) * factor;
      editorPanY = centerY - (centerY - editorPanY) * factor;
      editorZoom = newZoom;
      updateEditorTransform();
    }

    editorZoomInBtn.addEventListener('click', () => {

      let width = origW;

      const aspectRatio = origW / origH;

      if (origW > origH) {
        if (origW > MAX_SIZE) {

          height = Math.round(MAX_SIZE / aspectRatio);
        }

      let displayW, displayH;
      if (maxDisplayW / maxDisplayH < aspectRatio) {
        displayW = maxDisplayW;
        displayH = Math.round(maxDisplayW / aspectRatio);
      } else {
        displayH = maxDisplayH;
        displayW = Math.round(maxDisplayH * aspectRatio);

    // Cached coordinate conversion to prevent layout thrashing
    function getCanvasCoordinates(canvas, evt, rect) {
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX = evt.clientX;
      let clientY = evt.clientY;
      if (evt.touches && evt.touches.length > 0) {
        clientX = evt.touches[0].clientX;
        clientY = evt.touches[0].clientY;
      }
      return { 
        x: (clientX - rect.left) * scaleX, 
        y: (clientY - rect.top) * scaleY 
      };
    }

    function startDraw(e) {
      if (currentEditorTool !== 'brush') return;
      e.preventDefault();
      isDrawing = true;
      cachedEditorRect = maskCanvas.getBoundingClientRect();
      const pos = getCanvasCoordinates(maskCanvas, e, cachedEditorRect);
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);
      draw(e);
    }

    function endDraw(e) {
      if (!isDrawing) return;
      if (e && e.cancelable) e.preventDefault();
      isDrawing = false;
      cachedEditorRect = null;
      maskCtx.beginPath();
    }

    function draw(e) {
      if (!isDrawing || currentEditorTool !== 'brush') return;
      if (e.cancelable) e.preventDefault();
      if (!cachedEditorRect) cachedEditorRect = maskCanvas.getBoundingClientRect();
      const pos = getCanvasCoordinates(maskCanvas, e, cachedEditorRect);
      const scaleFactor = maskCanvas.width / cachedEditorRect.width;
      maskCtx.lineWidth = brushSizeInput.value * scaleFactor;
      maskCtx.lineCap = 'round';
      maskCtx.lineJoin = 'round';
      maskCtx.strokeStyle = '#FFFFFF';
      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);
    }

    function getTouchesDist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // --- MOUSE & TOUCH LISTENERS FOR EDITOR ---
    canvasContainer.addEventListener('mousedown', (e) => {

    canvasContainer.addEventListener('touchstart', (e) => {
      cachedEditorRect = canvasContainer.getBoundingClientRect();
      if (e.touches.length === 2) {

        editorPinchMidY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - cachedEditorRect.top;
      } else if (e.touches.length === 1) {
        if (currentEditorTool === 'brush') {
          startDraw(e);
        } else {
          isEditorPanning = true;
          editorPanStartX = e.touches[0].clientX;

        }
      }
    }, { passive: false });

    canvasContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = getTouchesDist(e.touches[0], e.touches[1]);

    canvasContainer.addEventListener('touchend', (e) => {

    // --- COMPOSITING ENGINE ---
    function createAlphaMask(maskCanvas, blurRadius = 2) {
      const alphaCanvas = document.createElement('canvas');
      alphaCanvas.width = maskCanvas.width;
      alphaCanvas.height = maskCanvas.height;
      const aCtx = alphaCanvas.getContext('2d');
      
      aCtx.drawImage(maskCanvas, 0, 0);
      const imgData = aCtx.getImageData(0, 0, alphaCanvas.width, alphaCanvas.height);
      const d = imgData.data;
      
      for (let i = 0; i < d.length; i += 4) {
        const brightness = (d[i] + d[i+1] + d[i+2]) / 3;
        d[i] = 255;
        d[i+1] = 255;
        d[i+2] = 255;
        d[i+3] = brightness;
      }
      aCtx.putImageData(imgData, 0, 0);

      if (blurRadius > 0) {
        const blurCanvas = document.createElement('canvas');
        blurCanvas.width = alphaCanvas.width;
        blurCanvas.height = alphaCanvas.height;
        const bCtx = blurCanvas.getContext('2d');
        bCtx.filter = `blur(${blurRadius}px)`;
        bCtx.drawImage(alphaCanvas, 0, 0);
        return blurCanvas;
      }
      return alphaCanvas;
    }

    async function compositeInpaintedResult(origCanvas, rawAiDataUrl, maskCanvas) {
      return new Promise((resolve) => {
        const aiImg = new Image();
        aiImg.onload = () => {
          const w = origCanvas.width;
          const h = origCanvas.height;

          const aiLayer = document.createElement('canvas');
          aiLayer.width = w;
          aiLayer.height = h;
          const aiCtx = aiLayer.getContext('2d');
          aiCtx.drawImage(aiImg, 0, 0, w, h);

          const alphaMask = createAlphaMask(maskCanvas, 2);
          aiCtx.globalCompositeOperation = 'destination-in';
          aiCtx.drawImage(alphaMask, 0, 0);

          const finalCanvas = document.createElement('canvas');
          finalCanvas.width = w;
          finalCanvas.height = h;
          const finalCtx = finalCanvas.getContext('2d');

          finalCtx.drawImage(origCanvas, 0, 0);
          finalCtx.globalCompositeOperation = 'source-over';
          finalCtx.drawImage(aiLayer, 0, 0);

          resolve(finalCanvas.toDataURL('image/jpeg', 0.95));
        };
        aiImg.src = rawAiDataUrl;
      });
    }

    async function convertToWebP(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth || img.width;
          canvas.height = img.naturalHeight || img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("Conversion failed"));
          }, 'image/webp', 0.88);
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    async function triggerAutoSave(originalSrc, finalCompositeSrc) {
      const autoSaveBadge = document.getElementById('autoSaveBadge');
      const autoSaveIcon = document.getElementById('autoSaveIcon');
      const autoSaveText = document.getElementById('autoSaveText');

      autoSaveBadge.classList.remove('hidden');
      autoSaveIcon.className = "w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse";
      autoSaveText.textContent = "Auto-saving...";

      try {
        const timestamp = Date.now();
        const origPath = `original_${timestamp}.webp`;
        const genPath = `generated_${timestamp}.webp`;

        const [origBlob, genBlob] = await Promise.all([
          convertToWebP(originalSrc),
          convertToWebP(finalCompositeSrc)
        ]);

        await Promise.all([
          supabaseClient.storage.from('photos').upload(origPath, origBlob, { contentType: 'image/webp' }),
          supabaseClient.storage.from('photos').upload(genPath, genBlob, { contentType: 'image/webp' })
        ]);

        await supabaseClient.from('gallery').insert([{
          original_image_path: origPath,
          generated_image_path: genPath
        }]);

        autoSaveIcon.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
        autoSaveText.textContent = "✓ Saved";
        loadGalleryThumbnail();
      } catch (err) {
        console.error("Autosave error:", err);
        autoSaveIcon.className = "w-1.5 h-1.5 rounded-full bg-rose-400";
        autoSaveText.textContent = "Saved locally";
      }
    }

    // --- AI INPAINTING SUBMISSION ("DOING MAGIC IT IS...") ---
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const promptToUse = PROMPTS[activePromptType];
      const base64Image = baseCanvas.toDataURL('image/jpeg', 0.95).split(',')[1];
      const base64Mask = maskCanvas.toDataURL('image/png').split(',')[1];

      processingView.classList.remove('hidden');
      
      let seconds = 0;

      const stepText = document.getElementById('processingStepText');
      
      stepText.textContent = "Doing magic it is...";
      timerText.textContent = "Doing magic it is... 0s";

      const timer = setInterval(() => {
        seconds++;
        timerText.textContent = `Doing magic it is... ${seconds}s`;
        stepText.textContent = "Doing magic it is...";
        progressBar.style.width = `${Math.min(20 + seconds * 10, 95)}%`;
      }, 1000);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 120000);

      try {
        const response = await fetch('/.netlify/functions/inpaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: promptToUse,
            image: base64Image,
            mask: base64Mask,
            model: 'gemini-3.1-flash-image'
          }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Server error");

        const candidateParts = data.candidates?.[0]?.content?.parts || [];
        let rawAiImgSrc = null;

        candidateParts.forEach((part) => {
          const inlineImg = part.inlineData || part.inline_data;
          if (inlineImg && inlineImg.data) {
            rawAiImgSrc = `data:${inlineImg.mimeType || 'image/jpeg'};base64,${inlineImg.data}`;
          }
        });

        if (!rawAiImgSrc) throw new Error("No inpaint returned from AI.");

        const finalCompositeSrc = await compositeInpaintedResult(baseCanvas, rawAiImgSrc, maskCanvas);

        isViewingGalleryItem = false;
        document.getElementById('deleteBtn').classList.add('hidden');
        document.getElementById('backBtnText').textContent = "New Scan";

        setupSliderDimensions(currentOriginalDataUrl, finalCompositeSrc);
        triggerAutoSave(currentOriginalDataUrl, finalCompositeSrc);

      } catch (err) {
        console.error(err);
        alert("Inpainting failed. Please paint the exact target tooth area.");
      } finally {
        clearInterval(timer);
        processingView.classList.add('hidden');
      }
    });

    // --- COMPARISON TOOL MODE (PAN VS SLIDE STRICT SEPARATION) ---
    function setCompMode(mode) {
      compMode = mode;
      const slider = document.getElementById('sliderHandle');
      const container = document.getElementById('compareContainer');

      if (mode === 'pan') {
        compModePanBtn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 bg-primary text-white shadow-pill";
        compModeSplitBtn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 text-slate-300 hover:text-white";
        container.style.cursor = 'grab';
        
        // Disable slider completely in Pan mode
        slider.style.pointerEvents = 'none';
        slider.style.opacity = '0.35';
      } else {
        compModeSplitBtn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 bg-primary text-white shadow-pill";
        compModePanBtn.className = "flex items-center space-x-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition active:scale-95 text-slate-300 hover:text-white";
        container.style.cursor = 'ew-resize';
        
        // Enable slider in Split mode
        slider.style.pointerEvents = 'auto';
        slider.style.opacity = '1';
      }
    }

    compModeSplitBtn.addEventListener('click', () => setCompMode('split'));
    compModePanBtn.addEventListener('click', () => setCompMode('pan'));

    function clampCompPan() {
      if (compZoom <= 1) {
        compPanX = 0;
        compPanY = 0;
        return;
      }
      const minX = compTargetW * (1 - compZoom) - 40;
      const maxX = 40;
      const minY = compTargetH * (1 - compZoom) - 40;
      const maxY = 40;

      compPanX = Math.min(Math.max(compPanX, minX), maxX);
      compPanY = Math.min(Math.max(compPanY, minY), maxY);
    }

    function updateCompTransform() {
      if (compRafPending) return;
      compRafPending = true;
      requestAnimationFrame(() => {
        clampCompPan();
        const viewport = document.getElementById('compareViewport');
        const overlay = document.getElementById('imgOverlayWrapper');
        const slider = document.getElementById('sliderHandle');

        viewport.style.transform = `translate3d(${compPanX}px, ${compPanY}px, 0) scale(${compZoom})`;
        compZoomLabel.textContent = `${Math.round(compZoom * 100)}%`;

        const unscaledSplitX = compSplitPercent * compTargetW;
        overlay.style.width = `${unscaledSplitX}px`;

        const screenSplitX = compPanX + (unscaledSplitX * compZoom);
        slider.style.left = `${screenSplitX}px`;
        compRafPending = false;
      });
    }

    function zoomCompAt(newZoom, centerX, centerY) {
      newZoom = Math.min(Math.max(newZoom, 1), 6);
      if (Math.abs(newZoom - compZoom) < 0.001) return;

      const factor = newZoom / compZoom;
      compPanX = centerX - (centerX - compPanX) * factor;
      compPanY = centerY - (centerY - compPanY) * factor;
      compZoom = newZoom;
      updateCompTransform();
    }

    compZoomInBtn.addEventListener('click', () => {
      zoomCompAt(compZoom + 0.5, compTargetW / 2, compTargetH / 2);
    });

    compZoomOutBtn.addEventListener('click', () => {
      zoomCompAt(compZoom - 0.5, compTargetW / 2, compTargetH / 2);
    });

    compZoomResetBtn.addEventListener('click', () => {
      compZoom = 1;
      compPanX = 0;
      compPanY = 0;
      setCompMode('split');
      updateCompTransform();
    });

    // --- SETUP SLIDER (Max Height Calculation without cutoff) ---
    function setupSliderDimensions(origSrc, genSrc) {
      const origImg = document.getElementById('imgOriginal');
      const genImg = document.getElementById('imgGenerated');
      const container = document.getElementById('compareContainer');
      const viewport = document.getElementById('compareViewport');

      let loaded = 0;
      const check = () => {
        loaded++;
        if (loaded === 2) {
          const natW = genImg.naturalWidth || 512;
          const natH = genImg.naturalHeight || 512;
          const ratio = natW / natH;

          // Maximize view space on mobile
          const maxW = Math.min(window.innerWidth - 16, 560);
          const maxH = Math.max(220, window.innerHeight - 150);

          let targetW, targetH;
          if (maxW / maxH < ratio) {
            targetW = maxW;
            targetH = Math.round(maxW / ratio);
          } else {
            targetH = maxH;
            targetW = Math.round(maxH * ratio);
          }

          compTargetW = targetW;
          compTargetH = targetH;

          container.style.width = `${targetW}px`;
          container.style.height = `${targetH}px`;
          viewport.style.width = `${targetW}px`;
          viewport.style.height = `${targetH}px`;
          origImg.style.width = `${targetW}px`;
          origImg.style.height = `${targetH}px`;
          genImg.style.width = `${targetW}px`;
          genImg.style.height = `${targetH}px`;

          compZoom = 1;
          compPanX = 0;
          compPanY = 0;
          compSplitPercent = 0.5;
          setCompMode('split');
          updateCompTransform();

          editorView.classList.add('hidden');
          libraryView.classList.add('hidden');
          comparisonView.classList.remove('hidden');
          comparisonView.classList.add('fade-enter');

          setTimeout(initComparisons, 20);
        }
      };

      origImg.onload = check;
      genImg.onload = check;
      origImg.src = origSrc;
      genImg.src = genSrc;
    }

    function initComparisons() {
      const container = document.getElementById('compareContainer');
      const slider = document.getElementById('sliderHandle');

      function updateSplitFromScreen(clientX) {
        if (compMode !== 'split') return;
        if (!cachedCompRect) cachedCompRect = container.getBoundingClientRect();
        const currentScreenX = clientX - cachedCompRect.left;
        const unscaledX = (currentScreenX - compPanX) / compZoom;
        compSplitPercent = Math.min(Math.max(unscaledX / compTargetW, 0), 1);
        updateCompTransform();
      }

      slider.onmousedown = (e) => {
        if (compMode !== 'split') return;
        e.stopPropagation();
        isCompSliding = true;
        cachedCompRect = container.getBoundingClientRect();
      };
      slider.ontouchstart = (e) => {
        if (compMode !== 'split') return;
        e.stopPropagation();
        isCompSliding = true;
        cachedCompRect = container.getBoundingClientRect();
      };

      container.onmousedown = (e) => {
        cachedCompRect = container.getBoundingClientRect();
        if (compMode === 'pan') {
          isCompPanning = true;
          isCompSliding = false;
          compPanStartX = e.clientX;
          compPanStartY = e.clientY;
          compPanOrigX = compPanX;
          compPanOrigY = compPanY;
          container.style.cursor = 'grabbing';
        } else if (compMode === 'split') {
          isCompSliding = true;
          isCompPanning = false;
          updateSplitFromScreen(e.clientX);
        }
      };

      window.addEventListener('mousemove', (e) => {
        if (isCompSliding && compMode === 'split') {
          updateSplitFromScreen(e.clientX);
        } else if (isCompPanning && compMode === 'pan') {
          compPanX = compPanOrigX + (e.clientX - compPanStartX);
          compPanY = compPanOrigY + (e.clientY - compPanStartY);
          updateCompTransform();
        }
      });

      window.addEventListener('mouseup', () => {
        isCompSliding = false;
        if (isCompPanning) {
          isCompPanning = false;
          if (compMode === 'pan') container.style.cursor = 'grab';
        }
        cachedCompRect = null;
      });

      // Touch handlers
      container.addEventListener('touchstart', (e) => {
        cachedCompRect = container.getBoundingClientRect();
        if (e.touches.length === 2) {
          isCompSliding = false;
          isCompPanning = false;
          compInitialPinchDist = getTouchesDist(e.touches[0], e.touches[1]);
          compInitialPinchZoom = compZoom;
          compPinchMidX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - cachedCompRect.left;
          compPinchMidY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - cachedCompRect.top;
        } else if (e.touches.length === 1) {
          if (compMode === 'pan') {
            isCompPanning = true;
            isCompSliding = false;
            compPanStartX = e.touches[0].clientX;
            compPanStartY = e.touches[0].clientY;
            compPanOrigX = compPanX;
            compPanOrigY = compPanY;
          } else if (compMode === 'split') {
            isCompSliding = true;
            isCompPanning = false;
            updateSplitFromScreen(e.touches[0].clientX);
          }
        }
      }, { passive: false });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const dist = getTouchesDist(e.touches[0], e.touches[1]);
          const targetZoom = compInitialPinchZoom * (dist / compInitialPinchDist);
          zoomCompAt(targetZoom, compPinchMidX, compPinchMidY);
        } else if (e.touches.length === 1) {
          if (isCompSliding && compMode === 'split') {
            e.preventDefault();
            updateSplitFromScreen(e.touches[0].clientX);
          } else if (isCompPanning && compMode === 'pan') {
            e.preventDefault();
            compPanX = compPanOrigX + (e.touches[0].clientX - compPanStartX);
            compPanY = compPanOrigY + (e.touches[0].clientY - compPanStartY);
            updateCompTransform();
          }
        }
      }, { passive: false });

      container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) compInitialPinchDist = 0;
        if (e.touches.length === 0) {
          isCompSliding = false;
          isCompPanning = false;
          cachedCompRect = null;
        }
      });

      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = container.getBoundingClientRect();
        const cursorX = e.clientX - rect.left;
        const cursorY = e.clientY - rect.top;
        const zoomDelta = -Math.sign(e.deltaY) * 0.25;
        zoomCompAt(compZoom + zoomDelta, cursorX, cursorY);
      }, { passive: false });
    }

    // --- DOWNLOAD ---
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      try {
        const imgSrc = document.getElementById('imgGenerated').src;
        const response = await fetch(imgSrc);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = `SmileCreo_Inpaint_${Date.now()}.webp`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        alert("Export failed.");
      }
    });

    document.getElementById('closeComparisonBtn').addEventListener('click', () => {
      comparisonView.classList.add('hidden');
      if (isViewingGalleryItem) {
        libraryView.classList.remove('hidden');
      }
    });

    // --- GALLERY ---
    document.getElementById('openLibraryBtn').addEventListener('click', openGallery);
    document.getElementById('navOpenGalleryBtn').addEventListener('click', openGallery);
    document.getElementById('closeLibraryBtn').addEventListener('click', () => libraryView.classList.add('hidden'));

    function openGallery() {
      libraryView.classList.remove('hidden');
      libraryView.classList.add('fade-enter');
      loadGallery();
    }

    async function loadGalleryThumbnail() {
      try {
        const { data } = await supabaseClient.from('gallery').select('generated_image_path').order('created_at', { ascending: false }).limit(1);
        if (data && data.length > 0) {
          const { data: { publicUrl } } = supabaseClient.storage.from('photos').getPublicUrl(data[0].generated_image_path);
          const thumbEl = document.getElementById('galleryThumbImg');
          thumbEl.style.backgroundImage = `url('${publicUrl}')`;
          thumbEl.innerHTML = '';
        }
      } catch (e) {}
    }

    async function loadGallery() {
      const grid = document.getElementById('galleryGrid');
      const emptyNotice = document.getElementById('emptyGalleryNotice');
      grid.innerHTML = Array(4).fill(`<div class="aspect-square bg-white/10 animate-pulse rounded-2xl"></div>`).join('');
      emptyNotice.classList.add('hidden');

      try {
        const { data: records, error } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        grid.innerHTML = '';
        if (!records || records.length === 0) {
          emptyNotice.classList.remove('hidden');
          return;
        }

        records.forEach(rec => {
          const genUrl = supabaseClient.storage.from('photos').getPublicUrl(rec.generated_image_path).data.publicUrl;
          const origUrl = supabaseClient.storage.from('photos').getPublicUrl(rec.original_image_path).data.publicUrl;

          const card = document.createElement('div');
          card.className = "aspect-square rounded-2xl overflow-hidden glass-dark cursor-pointer transition active:scale-95 border border-white/10 relative group";
          card.innerHTML = `
            <img src="${genUrl}" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" loading="lazy" alt="Simulation" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition flex items-end justify-between p-2">
              <span class="text-[9px] font-semibold text-white bg-primary/80 px-2 py-0.5 rounded-full">
                Inspect
              </span>
            </div>
          `;

          card.onclick = () => {
            isViewingGalleryItem = true;
            currentActiveDocId = rec.id;
            currentActiveOrigPath = rec.original_image_path;
            currentActiveGenPath = rec.generated_image_path;

            document.getElementById('deleteBtn').classList.remove('hidden');
            document.getElementById('backBtnText').textContent = "Records";
            document.getElementById('autoSaveBadge').classList.remove('hidden');
            document.getElementById('autoSaveIcon').className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
            document.getElementById('autoSaveText').textContent = "Record";

            setupSliderDimensions(origUrl, genUrl);
          };

          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center text-xs text-rose-400 py-6">Could not load records.</div>`;
      }
    }

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm("Delete this simulation?")) return;
      try {
        await supabaseClient.from('gallery').delete().eq('id', currentActiveDocId);
        if (currentActiveOrigPath && currentActiveGenPath) {
          await supabaseClient.storage.from('photos').remove([currentActiveOrigPath, currentActiveGenPath]);
        }
        comparisonView.classList.add('hidden');
        libraryView.classList.remove('hidden');
        loadGallery();
        loadGalleryThumbnail();
      } catch (e) {
        alert("Failed to delete: " + e.message);
      }
    });

    window.addEventListener('load', initCamera);
  </script>
</body>
